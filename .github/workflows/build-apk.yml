name: Build & Release Signed Android APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Keystore
        run: |
          if [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          fi

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/BinfaeMobile-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeMobile-Signed-APK
          path: build-output/BinfaeMobile-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Obter Versao do Projeto
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "val=$VERSION" >> $GITHUB_OUTPUT

      - name: Publicar Release com Download Direto do APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Binfae Mobile v${{ steps.version.outputs.val }} - APK Oficial Assinado"
          body: |
            ### 📱 Binfae Mobile v${{ steps.version.outputs.val }} - Versão Oficial Nativa Android 🚀

            Aplicativo móvel Android nativo oficial (**`.apk`**) do ecossistema **BINFAE-GL**, assinado com certificado oficial de release (atualização direta sem desinstalar).

            #### 📥 Download Direto:
            - **[BinfaeMobile-release.apk](https://github.com/LucasFerreira198/BinfaeMobileApp/releases/download/latest/BinfaeMobile-release.apk)**: Toque para baixar e instalar no celular.

            #### 🚀 Principais Novidades da Versão ${{ steps.version.outputs.val }}:
            - 👤 **Foto de Perfil & Upload com Enquadramento 1:1**: Usuários e militares agora podem tirar fotos ou escolher da galeria com corte quadrado e centralização interativa antes de salvar.
            - ✏️ **Auto-Edição de Perfil para Qualquer Usuário**: Edição própria de perfil liberada diretamente pelo aplicativo (foto, nome de guerra, seção, telefone, e-mail e redefinição de senha).
            - 🛠️ **Gestão Completa de Manutenção em Bancada**: Envio com motivo/defeito discriminado, visualização em bancada, conclusão de reparo com laudo técnico e retorno do item com escolha de destino ou volta ao local de origem.
            - 🎨 **Avatares e Redesign Visual**: Identificação visual em destaque no Cabeçalho, Menu Lateral (Drawer), Perfil nas Configurações e Cautelas Operacionais.
            - ⚡ **Sincronização em Tempo Real**: Atualização instantânea com o banco de dados e compatibilidade nativa com a nova API do backend.
          files: build-output/BinfaeMobile-release.apk
          prerelease: false
          overwrite_files: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

