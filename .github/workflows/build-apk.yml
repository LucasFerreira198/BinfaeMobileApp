name: Build & Release Signed Android APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Keystore
        run: |
          if [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          fi

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/BinfaeMobile-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeMobile-Signed-APK
          path: build-output/BinfaeMobile-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release com Download Direto do APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Binfae Mobile v1.3.2 - APK Oficial Assinado"
          body: |
            ### 🚀 Binfae Mobile v1.3.2 - Segurança no Cold Start (Reabertura do App) e Teclado

            - **Bloqueio de Segurança no Cold Start & Retorno**:
              - Ao fechar o aplicativo por completo e reabri-lo, caso o usuário ainda esteja logado, a autenticação por **Biometria** (Digital / Face ID) ou **PIN de 4 dígitos** é imediatamente solicitada antes de liberar as telas.
              - Prompt biométrico disparado automaticamente ao abrir o app ou voltar do segundo plano.
              - Alternância flexível: se a biometria falhar ou o usuário preferir, pode alternar para PIN numérico em tela.
              - Prevenção contra loops falsos de bloqueio causados pelo diálogo nativo de biometria do Android.
            - **Adaptação Total ao Teclado Virtual (Android & iOS)**:
              - Hook reativo `useKeyboardHeight` com listeners nativos de abertura e fechamento do teclado.
              - Elevação dinâmica e redução inteligente da altura máxima de todos os Bottom Sheets e Modals (`AddItemModal`, `MovementModal`, `CreateUserModal`, `CreateMilitaryModal`, `EditUserModal`, `LocationsModal`).
              - `LoginScreen` responsivo: cabeçalho hero adaptativo e reposicionamento vertical que mantém SARAM, Senha e botão de login sempre visíveis acima do teclado.
            - **Gerenciamento de Usuários e Efetivo (Admin)**: Criação de contas vinculadas ao SARAM ou avulsas, alternância de privilégios de Admin e cadastro de militares.
          files: build-output/BinfaeMobile-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
