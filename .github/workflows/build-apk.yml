name: Build & Release Signed Android APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Keystore
        run: |
          if [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          fi

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/BinfaeMobile-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeMobile-Signed-APK
          path: build-output/BinfaeMobile-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release com Download Direto do APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Binfae Mobile v1.3.4 - APK Oficial Assinado"
          body: |
            ### 🛠️ Binfae Mobile v1.3.4 - Correção Crítica de Crash em Detalhes do Material

            - **Correção Definitiva de Crash ao Abrir Detalhes do Material**:
              - Eliminada renderização condicional perigosa (`&&`) com valores de texto vazios que causavam erro fatal de Invariant Violation no Android.
              - Todas as condicionais de atributos opcionais (`bmp`, `codigo_interno`, `numero_serie`, `observacoes`, `componentes`) agora utilizam checagens booleanas defensivas ternárias.
            - **Geração Segura de QR Code para Impressão e PDF**:
              - Substituição de dependências pesadas de Node.js (`fs`/`stream`) por renderização vetorial SVG pura e resiliente.
              - Tratamento defensivo de erros (`onError`) na renderização do QR Code em tela.
            - **Proteção Global com Error Boundary**:
              - Implementado `ErrorBoundary` nativo na raiz do aplicativo e nos modais principais para recuperação instantânea e prevenção contra encerramentos repentinos do app.
          files: build-output/BinfaeMobile-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
