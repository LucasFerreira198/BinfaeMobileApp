name: Build & Release Signed Android APK

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Keystore
        run: |
          if [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          fi

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/BinfaeMobile-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeMobile-Signed-APK
          path: build-output/BinfaeMobile-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release com Download Direto do APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Binfae Mobile v1.3.3 - APK Oficial Assinado"
          body: |
            ### 🚀 Binfae Mobile v1.3.3 - Gestão de Grupos, QR Code com Impressão & PDF, e Otimizações

            - **Carência de 5 Segundos para Biometria/PIN**:
              - Evita que a biometria seja solicitada indevidamente enquanto o aplicativo está sendo minimizado/fechado.
              - Ao retornar ao primeiro plano, exige autenticação se o app permaneceu em segundo plano por pelo menos 5 segundos.
              - Bloqueio instantâneo mantido para cold start (ao reabrir app fechado).
            - **Menu Lateral à Esquerda**:
              - O Drawer Menu agora abre suavemente pelo lado esquerdo da tela, alinhado com o botão de menu.
            - **Gestão Completa de Grupos & Subgrupos**:
              - Nova tela de visualização, criação e edição de grupos e subgrupos de materiais acessível diretamente pelo menu lateral.
            - **Simplificação do Sistema de Movimentação**:
              - Foco exclusivo em "Transferir Local".
              - Campo de justificativa agora é opcional.
              - Novo Seletor Hierárquico e Pesquisável de Locais Físicos, preparado para dezenas/centenas de depósitos, armários e prateleiras.
            - **Gestão Administrativa de Militares**:
              - Edição completa dos dados do efetivo militar (Posto/Graduação, Nome de Guerra, Nome Completo, E-mail, Celular) diretamente no Painel Admin.
            - **Visualização de QR Code, Impressão e PDF**:
              - Nova aba de QR Code no detalhe do material com renderização nativa de alta resolução.
              - Botão de Impressão Direta (`expo-print`) para impressoras térmicas/rede.
              - Botão de Download / Compartilhamento de Etiqueta Patrimonial em PDF oficial (`expo-sharing`).
          files: build-output/BinfaeMobile-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
